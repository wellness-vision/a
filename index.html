<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Visor interactivo de un modelo 3D GLB.">
  <title>Visor 3D</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">VISUALIZACIÓN INTERACTIVA</div><h1>Visor 3D</h1></div>
      <span class="file-tag">GLB</span>
    </header>
    <section class="viewer-wrap" aria-label="Visor del modelo 3D">
      <model-viewer id="viewer" src="models/modelo.glb" alt="Modelo tridimensional interactivo" camera-controls touch-action="pan-y" shadow-intensity="0.65" exposure="1" tone-mapping="neutral" environment-image="neutral" interaction-prompt="auto" loading="eager" reveal="auto">
        <div class="loading" slot="poster">Cargando modelo 3D…</div>
        <div class="progress-track" slot="progress-bar"><div id="progress" class="progress-fill"></div></div>
      </model-viewer>
      <div id="error" class="error" role="alert" hidden>No se pudo cargar el modelo. Comprueba que <code>models/modelo.glb</code> existe y abre la página con un servidor web o desde GitHub Pages.</div>
      <div class="viewer-actions">
        <button type="button" id="reset" aria-label="Restablecer cámara">⟲ <span>Restablecer vista</span></button>
        <button type="button" id="rotate" aria-pressed="false">↻ <span>Giro automático: no</span></button>
        <button type="button" id="fullscreen">⛶ <span>Pantalla completa</span></button>
      </div>
    </section>
    <footer><span>Arrastra para girar · Rueda o pellizca para acercar · Botón derecho para desplazar</span><span>Modelo 3D interactivo</span></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
